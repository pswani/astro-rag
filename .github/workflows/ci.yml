name: ci
on:
  push:
  pull_request:
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,oracle]"
      - run: python scripts/fetch_ephemeris.py
      - run: ruff check src tests scripts
      - run: lint-imports
      - run: pytest
