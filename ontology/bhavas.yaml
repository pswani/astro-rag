# Bhavas (houses) and house groups (design §8; KNW-1, KNW-3, KNW-12). Houses are a distinct entity
# type from rashis (signs). Index 0 = the 1st house; IDs are bhava:1 … bhava:12.
#
# Ordinals are matched only when a house word follows ("10th house", "दशम भाव"); a bare ordinal is
# left to the planner (docs/design/phase1-foundations.md §3.6).
# Karakas are the commonly quoted sthira (fixed) significators; provisional until reviewed.
meta: {status: provisional, reviewed_by: null, source: "BPHS ch. 11–12, 32 (edition: requirements open question 1)"}
