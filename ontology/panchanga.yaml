# Panchanga limbs (design §7.4, §8; KNW-1, KNW-12). Order matters: the calculation indexes these
# lists (tithi 1 = index 0, nitya yoga 1 = index 0, vara 0 = Sunday). Nitya yogas are a distinct
# entity type from chart yogas (yogas.yaml).
#
# Naming rules (docs/design/phase1-foundations.md §3.6):
# - a tithi name used in both pakshas (Ekadashi) is ambiguous; with its paksha it resolves;
# - nitya yogas are named with "yoga" (Brahma yoga), because several bare names are deities;
# - bare "Shukla" is the paksha or the 24th nitya yoga, so it is ambiguous.
