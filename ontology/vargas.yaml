# Divisional charts: one declared Parashari construction per varga (VAR-1, VAR-2, KNW-11).
#
# Equal parts:  part = floor(deg_in_sign / (30 / divisions))
#               varga_sign = (start + step × part) mod 12
#               start = sign + offset (basis: relative) or offset (basis: absolute)
#               offsets by rule: same | by_parity {odd, even} | by_modality {movable, fixed, dual}
#                                | by_element {fire, earth, air, water}
# Table parts:  table.odd / table.even list [end_degree, sign] in order; the part containing the
#               degree gives the sign directly (D2 hora, D30 trimshamsha).
# A degree exactly on a part boundary belongs to the later part.
meta: {status: provisional, reviewed_by: null, source: "BPHS ch. 6 (edition: requirements open question 1)"}
vargas:
  D1:  {divisions: 1,  parts: equal, start: {rule: same}}
  D2:  {divisions: 2,  parts: table, table: {odd: [[15, 4], [30, 3]], even: [[15, 3], [30, 4]]}}
  D3:  {divisions: 3,  parts: equal, step: 4, start: {rule: same}}
  D4:  {divisions: 4,  parts: equal, step: 3, start: {rule: same}}
  D7:  {divisions: 7,  parts: equal, start: {rule: by_parity, odd: 0, even: 6}}
  D9:  {divisions: 9,  parts: equal, start: {rule: by_modality, movable: 0, fixed: 8, dual: 4}}
  D10: {divisions: 10, parts: equal, start: {rule: by_parity, odd: 0, even: 8}}
  D12: {divisions: 12, parts: equal, start: {rule: same}}
  D16: {divisions: 16, parts: equal, start: {rule: by_modality, basis: absolute, movable: 0, fixed: 4, dual: 8}}
  D20: {divisions: 20, parts: equal, start: {rule: by_modality, basis: absolute, movable: 0, fixed: 8, dual: 4}}
  D24: {divisions: 24, parts: equal, start: {rule: by_parity, basis: absolute, odd: 4, even: 3}}
  D27: {divisions: 27, parts: equal, start: {rule: by_element, basis: absolute, fire: 0, earth: 3, air: 6, water: 9}}
  D30: {divisions: 30, parts: table, table: {odd: [[5, 0], [10, 10], [18, 8], [25, 2], [30, 6]],
                                            even: [[5, 1], [12, 5], [20, 11], [25, 9], [30, 7]]}}
  D40: {divisions: 40, parts: equal, start: {rule: by_parity, basis: absolute, odd: 0, even: 6}}
  D45: {divisions: 45, parts: equal, start: {rule: by_modality, basis: absolute, movable: 0, fixed: 4, dual: 8}}
  D60: {divisions: 60, parts: equal, start: {rule: same}}
