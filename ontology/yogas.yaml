# Chart yogas and doshas: IDs and names only (design §8; KNW-1, KNW-5 g, KNW-12). Their conditions
# live in rule cards (phase 3). This is a seed for tagging; the curated Core set of 20–30 is
# chosen with the reviewer (design §10.7), and entries may be added or dropped then.
#
# Chart yogas are a distinct entity type from nitya yogas (panchanga.yaml). Vajra and Shula are
# both, so "Vajra yoga" and "Shula yoga" are ambiguous in both files.
